name: Run Scala App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-project:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'sbt'

    - name: Run application
      run: sbt run
